# invented routes
- route:
    id: route-0
    from:
      uri: "timer:tick?period=5000"
      steps:
        - toD:
            uri: "exec:/usr/bin/cleanup"
- route:
    id: route-1
    from:
      uri: "jms:queue:orders"
      steps:
        - to:
            uri: "mock:result"
        - wireTap:
            uri: "mock:result"
        - to: "ftp://files.example.test/in?password=plain"
        - wireTap:
            uri: "kafka:out?brokers=localhost:9092&saslJaasConfig=RAW({{kafka.jaas}})"
- route:
    id: route-2
    from:
      uri: "kafka:events?brokers=localhost:9092"
      steps:
        - wireTap:
            uri: "direct:missing"
        - wireTap:
            uri: "mock:result"
- route:
    id: route-3
    from:
      uri: "platform-http:/api/orders"
      steps:
        - wireTap:
            uri: "sql:select 1"
        - to:
            uri: "direct:missing"
