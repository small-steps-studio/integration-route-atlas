# invented routes
- route:
    id: route-0
    from:
      uri: "sftp://ops@files.example.test/out?password={{sftp.pw}}"
      steps:
        - to: "log:info"
        - to: "bean:orderService"
        - to: "bean:orderService"
- route:
    id: route-1
    from:
      uri: "kafka:events?brokers=localhost:9092"
      steps:
        - toD:
            uri: "http://partner.example.test/api?token=abc123"
        - toD:
            uri: "ftp://files.example.test/in?password=plain"
- route:
    id: route-2
    from:
      uri: "sftp://ops@files.example.test/out?password={{sftp.pw}}"
      steps:
        - to: "direct:validate"
        - wireTap:
            uri: "seda:jobs"
- route:
    id: route-3
    from:
      uri: "direct:start"
      steps:
        - to: "smtp://mail.example.test?username=a&password={{mail.pw}}"
- route:
    id: route-4
    from:
      uri: "jms:queue:orders"
      steps:
        - toD:
            uri: "exec:/usr/bin/cleanup"
        - wireTap:
            uri: "http://partner.example.test/api?token=abc123"
